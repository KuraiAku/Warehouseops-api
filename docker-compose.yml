services:
  db:
    image: postgres:17
    container_name: warehouse_ops_db
    environment:
      POSTGRES_DB: warehouse_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: warehouse_ops_api
    depends_on:
      - db
    environment:
      DB_NAME: warehouse_ops
      TEST_DB_NAME: warehouse_ops_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"

volumes:
  postgres_data: